name: Windows desktop build

on:
  push:
    branches: [main]
    paths: ['src/**', 'src-tauri/**', 'scripts/**', 'package.json', 'bun.lock', '.github/workflows/windows-desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --network-concurrency 1
      - name: Build Tauri installer on remote runner
        run: bun run desktop:build
      - name: Smoke test desktop startup
        shell: pwsh
        run: |
          $app = Start-Process -FilePath (Resolve-Path src-tauri/target/release/robot-analyzer.exe) -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($app.HasExited) { throw "Robot Analyzer exited during startup (code $($app.ExitCode))." }
            Write-Output "Desktop process stayed running for the startup smoke test."
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: robot-analyzer-windows
          path: |
            src-tauri/target/release/robot-analyzer.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
